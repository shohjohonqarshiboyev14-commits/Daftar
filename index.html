<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E78">
<title>Maxfiy daftar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EDF1F5;--card:#fff;--ink:#17202E;--mut:#5E6B7D;--line:#D5DCE5;--acc:#0B6E78;--on:#fff;--star:#D9961A;--bad:#B3322B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151D;--card:#1A212C;--ink:#E7ECF3;--mut:#93A0B2;--line:#2A3342;--acc:#3FB8C4;--on:#06262A;--star:#F0B440;--bad:#F07A72;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none}
.fld:focus-visible,.btn:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#lock{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto;padding:24px}
#lock h1{font-size:2rem}
#lock p{margin:0;color:var(--mut)}
.err{color:var(--bad);min-height:1.4em;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 8px;max-width:720px;margin:0 auto}
header h1{font-size:1.5rem}
header div{display:flex;gap:8px}
.sm{padding:8px 12px;font-size:.9rem}
main{max-width:720px;margin:0 auto;padding:0 16px 110px}
.bar{display:flex;gap:8px;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.bar .fld{min-width:0}
.note{background:var(--card);border:1px solid var(--star);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.9rem}
.cnt{color:var(--mut);font-size:.85rem;margin:2px 2px 8px}
.it{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px 14px 14px 8px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer}
.it.s{border-left-color:var(--star)}
.it h2{font-size:1.1rem;overflow-wrap:anywhere}
.it p{grid-column:1;margin:0;color:var(--mut);font-size:.92rem;overflow-wrap:anywhere}
.it .meta{grid-column:1/-1;font-size:.8rem;color:var(--mut);margin-top:4px}
.star{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--line);padding:4px}
.s .star{color:var(--star)}
.empty{text-align:center;color:var(--mut);padding:48px 16px}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(0,0,0,.28);padding:14px 22px;border-radius:999px}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
.ov>div{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
textarea.fld{min-height:42vh;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="lock">
  <h1>Maxfiy daftar</h1>
  <p id="lmsg"></p>
  <input id="pin" class="fld" type="password" autocomplete="off" placeholder="PIN yoki parol">
  <input id="pin2" class="fld" type="password" autocomplete="off" placeholder="Qayta kiriting" hidden>
  <p id="lerr" class="err" role="alert"></p>
  <button id="lbtn" class="btn">Kirish</button>
</section>

<div id="app" hidden>
  <header>
    <h1>Maxfiy daftar</h1>
    <div>
      <button class="btn alt sm" id="bLock">Qulflash</button>
      <button class="btn alt sm" id="bSet">Sozlamalar</button>
    </div>
  </header>
  <main>
    <div class="bar">
      <input id="q" class="fld" type="search" placeholder="Qidirish…">
      <button class="chip" id="fStar" aria-pressed="false">★ Muhim</button>
      <button class="chip" id="fTrash" aria-pressed="false">Savat</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="note" id="bk" hidden></div>
    <div class="cnt" id="cnt"></div>
    <div id="list"></div>
  </main>
  <button class="btn fab" id="bNew">+ Yangi yozuv</button>
</div>

<div id="ed" class="ov" hidden>
  <div>
    <input id="eT" class="fld" placeholder="Sarlavha" maxlength="200">
    <textarea id="eB" class="fld" placeholder="Matn (ixtiyoriy)"></textarea>
    <input id="eG" class="fld" placeholder="Kategoriya (masalan: parol, g‘oya)" maxlength="40">
    <div class="row">
      <button class="btn alt sm" id="eCopy">Matnni nusxalash</button>
      <button class="btn alt sm" id="eGen">Parol yaratish</button>
    </div>
    <div class="row">
      <button class="btn" id="eSave">Saqlash</button>
      <button class="btn alt" id="eCancel">Bekor qilish</button>
    </div>
    <button class="btn alt" id="eRes" hidden>Tiklash</button>
    <button class="btn bad" id="eDel">O‘chirish</button>
  </div>
</div>

<div id="st" class="ov" hidden>
  <div>
    <h2>Sozlamalar</h2>
    <button class="btn alt" id="sExp">Zaxira nusxa olish (shifrlangan)</button>
    <button class="btn alt" id="sImp">Zaxira nusxani yuklash</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button class="btn alt" id="sPin">PIN/parolni almashtirish</button>
    <button class="btn bad" id="sWipe">Barcha ma’lumotni o‘chirish</button>
    <button class="btn" id="sClose">Orqaga</button>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var K='md_vault_v1',F='md_fails',U='md_until';
var enc=new TextEncoder(),dec=new TextDecoder();
var key=null,salt=null,items=[],flt={q:'',star:false,tag:'',trash:false},cur=null,hiddenAt=0,busy=false,iters=600000,idleT=0;

function ls(a,k,v){try{if(a==='g')return localStorage.getItem(k);if(a==='s')localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2400)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(ts){var d=new Date(ts);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()}

/* ---- Shifrlash: PBKDF2 (250 000) + AES-256-GCM ---- */
async function derive(pin,s,it){
  var m=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:it||600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(items)));
  return{v:1,it:iters,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function save(){
  var v=await seal();
  try{localStorage.setItem(K,JSON.stringify(v));return true}catch(e){toast('Saqlab bo‘lmadi: xotira to‘lgan');return false}
}
async function unseal(v,pin){
  var s=unb64(v.salt),it=v.it||250000,k=await derive(pin,s,it);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.ct));
  return{k:k,s:s,it:it,list:JSON.parse(dec.decode(pt))};
}

/* ---- Qulf ekrani ---- */
function showLock(){
  key=null;items=[];cur=null;clearTimeout(idleT);
  ['#app','#ed','#st'].forEach(function(s){$(s).hidden=true});
  $('#lock').hidden=false;
  var has=!!ls('g',K);
  $('#pin2').hidden=has;
  $('#lmsg').textContent=has?'Kirish uchun PIN yoki parolni kiriting.':'Yangi PIN yoki parol o‘rnating (kamida 4 belgi, 6 va undan ko‘pi yaxshiroq). Uni unutsangiz, ma’lumotni tiklab bo‘lmaydi.';
  $('#lbtn').textContent=has?'Kirish':'O‘rnatish';
  $('#pin').value='';$('#pin2').value='';$('#lerr').textContent='';
}
async function submitLock(){
  if(busy)return;
  if(!window.crypto||!crypto.subtle){$('#lerr').textContent='Bu brauzer shifrlashni qo‘llab-quvvatlamaydi. Chrome’da oching.';return}
  var pin=$('#pin').value,v=ls('g',K),err=$('#lerr');err.textContent='';
  busy=true;$('#lbtn').disabled=true;
  try{
    if(!v){
      if(pin.length<4){err.textContent='Kamida 4 belgi kiriting.';return}
      if(pin!==$('#pin2').value){err.textContent='Ikkala maydon bir xil emas.';return}
      salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pin,salt,iters);items=[];
      if(await save())enter();
    }else{
      var wait=(+ls('g',U)||0)-Date.now();
      if(wait>0){err.textContent='Biroz kuting: '+Math.ceil(wait/1000)+' soniya.';return}
      try{
        var r=await unseal(JSON.parse(v),pin);
        key=r.k;salt=r.s;items=r.list;iters=r.it;ls('r',F);ls('r',U);if(iters<600000){iters=600000;salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pin,salt,iters);await save()}enter();
      }catch(e){
        var n=(+ls('g',F)||0)+1;ls('s',F,n);
        if(n>=5)ls('s',U,Date.now()+Math.min(600,30*(n-4))*1000);
        err.textContent='PIN yoki parol noto‘g‘ri.'+(n>=5?' Biroz kuting.':'');
      }
    }
  }finally{busy=false;$('#lbtn').disabled=false;$('#pin').value='';$('#pin2').value=''}
}
function enter(){
  $('#lock').hidden=true;$('#app').hidden=false;
  flt={q:'',star:false,tag:'',trash:false};$('#q').value='';
  items=items.filter(function(i){return !i.del||Date.now()-i.del<2592e6});
  render();bump();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
}

/* ---- Ro‘yxat ---- */
function render(){
  var q=flt.q.toLowerCase();
  var tags=[];items.forEach(function(i){if(i.tag&&tags.indexOf(i.tag)<0)tags.push(i.tag)});tags.sort();
  if(flt.tag&&tags.indexOf(flt.tag)<0)flt.tag='';
  $('#fStar').setAttribute('aria-pressed',flt.star);$('#fTrash').setAttribute('aria-pressed',flt.trash);
  var bk=$('#bk');bk.hidden=!(items.length&&!flt.trash&&Date.now()-(+ls('g','md_bk')||0)>12096e5);
  bk.textContent='Zaxira nusxa uzoq vaqtdan beri olinmagan. Sozlamalar → Zaxira nusxa olish.';
  $('#chips').innerHTML=tags.map(function(t){return'<button class="chip" data-tag="'+esc(t)+'" aria-pressed="'+(flt.tag===t)+'">'+esc(t)+'</button>'}).join('');
  var list=items.filter(function(i){
    return(!!i.del===flt.trash)&&(!flt.star||i.star)&&(!flt.tag||i.tag===flt.tag)&&(!q||(i.title+' '+i.body+' '+i.tag).toLowerCase().indexOf(q)>=0);
  }).sort(function(a,b){return(b.star|0)-(a.star|0)||b.upd-a.upd});
  $('#cnt').textContent=items.length?list.length+' ta yozuv':'';
  $('#list').innerHTML=list.length?list.map(function(i){
    var sn=i.body.replace(/\s+/g,' ').slice(0,120);
    return'<article class="it'+(i.star?' s':'')+'" data-id="'+i.id+'"><h2>'+esc(i.title||'Nomsiz')+'</h2><button class="star" data-star="'+i.id+'" aria-label="Muhim deb belgilash">'+(i.star?'★':'☆')+'</button>'+(sn?'<p>'+esc(sn)+'</p>':'')+'<div class="meta">'+(i.tag?esc(i.tag)+' | ':'')+fmt(i.upd)+'</div></article>';
  }).join(''):'<div class="empty">'+(items.length?'Hech narsa topilmadi.':'Hozircha yozuv yo‘q. “Yangi yozuv” tugmasini bosing.')+'</div>';
}

/* ---- Tahrirlash ---- */
function openEd(id){
  cur=id?items.filter(function(i){return i.id===id})[0]:null;
  $('#eT').value=cur?cur.title:'';$('#eB').value=cur?cur.body:'';$('#eG').value=cur?cur.tag:'';
  $('#eDel').hidden=!cur;$('#eDel').textContent=cur&&cur.del?'Butunlay o‘chirish':'Savatga tashlash';$('#eRes').hidden=!(cur&&cur.del);$('#ed').hidden=false;$('#eT').focus();
}
async function saveEd(){
  var t=$('#eT').value.trim(),b=$('#eB').value,g=$('#eG').value.trim();
  if(!t&&!b.trim()){toast('Sarlavha yoki matn kiriting');return}
  if(cur){cur.title=t;cur.body=b;cur.tag=g;cur.upd=Date.now()}
  else items.push({id:uid(),title:t,body:b,tag:g,star:false,upd:Date.now()});
  await save();$('#ed').hidden=true;render();toast('Saqlandi');
}
async function delEd(){
  if(!cur)return;
  if(!cur.del){cur.del=Date.now();toast('Savatga o‘tkazildi (30 kun saqlanadi)')}
  else{if(!confirm('Bu yozuv butunlay o‘chiriladi. Davom etilsinmi?'))return;var c=cur;items=items.filter(function(i){return i!==c});toast('O‘chirildi')}
  await save();$('#ed').hidden=true;render();
}
function bump(){clearTimeout(idleT);if(key)idleT=setTimeout(showLock,120000)}

/* ---- Sozlamalar ---- */
async function exportBk(){
  var v=await seal(),blob=new Blob([JSON.stringify(v)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='maxfiy-daftar-zaxira-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  ls('s','md_bk',Date.now());render();toast('Zaxira nusxa saqlandi');
}
async function importBk(file){
  try{
    var v=JSON.parse(await file.text());
    var pin=prompt('Zaxira nusxa o‘sha paytdagi PIN yoki parolni kiriting:');
    if(pin===null)return;
    var r=await unseal(v,pin),have={},n=0;
    items.forEach(function(i){have[i.id]=1});
    r.list.forEach(function(i){if(!have[i.id]){items.push(i);n++}});
    await save();render();toast(n+' ta yozuv qo‘shildi');
  }catch(e){toast('Zaxira nusxani ochib bo‘lmadi (PIN noto‘g‘ri yoki fayl buzilgan)')}
}
async function changePin(){
  var p=prompt('Yangi PIN yoki parol (kamida 4 belgi):');
  if(p===null)return;
  if(p.length<4){toast('Kamida 4 belgi kerak');return}
  if(p!==prompt('Yangi PIN yoki parolni qayta kiriting:')){toast('Ikkalasi bir xil emas');return}
  salt=crypto.getRandomValues(new Uint8Array(16));iters=600000;key=await derive(p,salt,iters);
  await save();toast('PIN almashtirildi');
}
function wipe(){
  if(!confirm('Barcha yozuvlar butunlay o‘chiriladi. Davom etilsinmi?'))return;
  if(!confirm('Bu amalni qaytarib bo‘lmaydi. Aniq o‘chirilsinmi?'))return;
  ls('r',K);ls('r',F);ls('r',U);showLock();
}

/* ---- Hodisalar ---- */
$('#lbtn').onclick=submitLock;
['#pin','#pin2'].forEach(function(s){$(s).addEventListener('keydown',function(e){if(e.key==='Enter')submitLock()})});
$('#bLock').onclick=showLock;
$('#bNew').onclick=function(){openEd(null)};
$('#q').oninput=function(e){flt.q=e.target.value;render()};
$('#fStar').onclick=function(){flt.star=!flt.star;render()};
$('#chips').onclick=function(e){var t=e.target.getAttribute('data-tag');if(t!==null){flt.tag=flt.tag===t?'':t;render()}};
$('#list').onclick=async function(e){
  var s=e.target.closest('[data-star]');
  if(s){var it=items.filter(function(i){return i.id===s.getAttribute('data-star')})[0];if(it){it.star=!it.star;await save();render()}return}
  var a=e.target.closest('.it');if(a)openEd(a.getAttribute('data-id'));
};
$('#eSave').onclick=saveEd;
$('#eCancel').onclick=function(){$('#ed').hidden=true};
$('#eDel').onclick=delEd;
$('#eRes').onclick=async function(){if(cur){delete cur.del;cur.upd=Date.now();await save();$('#ed').hidden=true;render();toast('Tiklandi')}};
$('#fTrash').onclick=function(){flt.trash=!flt.trash;render()};
$('#eGen').onclick=function(){var cs='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?',a=crypto.getRandomValues(new Uint32Array(20)),p='';for(var i=0;i<20;i++)p+=cs[a[i]%cs.length];var b=$('#eB');b.value=(b.value?b.value+'\n':'')+p;toast('Kuchli parol qo‘shildi')};
$('#eCopy').onclick=function(){var t=$('#eB').value;if(!t)return;try{navigator.clipboard.writeText(t).then(function(){toast('Nusxalandi. 30 soniyada tozalanadi');setTimeout(function(){try{navigator.clipboard.writeText('')}catch(e){}},30000)},function(){toast('Nusxalab bo‘lmadi')})}catch(e){toast('Nusxalab bo‘lmadi')}};
['pointerdown','keydown','scroll'].forEach(function(n){document.addEventListener(n,bump,true)});
$('#bSet').onclick=function(){$('#st').hidden=false};
$('#sClose').onclick=function(){$('#st').hidden=true};
$('#sExp').onclick=exportBk;
$('#sImp').onclick=function(){$('#fileIn').click()};
$('#fileIn').onchange=function(e){var f=e.target.files[0];e.target.value='';if(f)importBk(f)};
$('#sPin').onclick=changePin;
$('#sWipe').onclick=wipe;

/* Ilova fonga o‘tib 1 daqiqadan ko‘p tursa, avtomatik qulflanadi */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now()}
  else if(key&&hiddenAt&&Date.now()-hiddenAt>15000){showLock()}
});

showLock();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
