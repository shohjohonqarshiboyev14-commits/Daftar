<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E78">
<title>Maxfiy daftar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EDF1F5;--card:#fff;--ink:#17202E;--mut:#5E6B7D;--line:#D5DCE5;--acc:#0B6E78;--on:#fff;--star:#D9961A;--bad:#B3322B;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151D;--card:#1A212C;--ink:#E7ECF3;--mut:#93A0B2;--line:#2A3342;--acc:#3FB8C4;--on:#06262A;--star:#F0B440;--bad:#F07A72;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10151D;--card:#1A212C;--ink:#E7ECF3;--mut:#93A0B2;--line:#2A3342;--acc:#3FB8C4;--on:#06262A;--star:#F0B440;--bad:#F07A72;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none}
.fld:focus-visible,.btn:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#lock{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto;padding:24px}
#lock h1{font-size:2rem}
#lock p{margin:0;color:var(--mut)}
.err{color:var(--bad);min-height:1.4em;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 8px;max-width:720px;margin:0 auto}
header h1{font-size:1.5rem}
header div{display:flex;gap:8px}
.sm{padding:8px 12px;font-size:.9rem}
main{max-width:720px;margin:0 auto;padding:0 16px 110px}
.bar{display:flex;gap:8px;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.bar .fld{min-width:0}
.note{background:var(--card);border:1px solid var(--star);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.9rem}
.row .fld{flex:2;min-width:0}
.lb{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:.85rem}
.ck{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.ck input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.ck span{flex:1;overflow-wrap:anywhere}.ck.d span{text-decoration:line-through;color:var(--mut)}
.ck button{background:none;border:0;color:var(--bad);font-size:1.3rem;padding:0 6px}
.ims{display:flex;gap:10px;flex-wrap:wrap}.ims div{position:relative}
.ims img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ims .btn{position:absolute;top:-8px;right:-8px;padding:2px 9px;background:var(--card)}
#iv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ivb{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#iv img{max-width:100%;max-height:calc(100% - 90px);object-fit:contain}
button.note{width:100%;text-align:left;cursor:pointer}#dk{border-color:var(--bad)}
.od{border-left-color:var(--bad)}
.cnt{color:var(--mut);font-size:.85rem;margin:2px 2px 8px}
.it{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px 14px 14px 8px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer}
.it.s{border-left-color:var(--star)}
.it h2{font-size:1.1rem;overflow-wrap:anywhere}
.it p{grid-column:1;margin:0;color:var(--mut);font-size:.92rem;overflow-wrap:anywhere}
.it .meta{grid-column:1/-1;font-size:.8rem;color:var(--mut);margin-top:4px}
.star{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--line);padding:4px}
.s .star{color:var(--star)}
.empty{text-align:center;color:var(--mut);padding:48px 16px}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(0,0,0,.28);padding:14px 22px;border-radius:999px}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
.ov>div{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
textarea.fld{min-height:42vh;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- v4 dizayn ---- */
:root{--bg2:#DCE5EE;--sh:0 1px 2px rgba(20,32,50,.06),0 8px 24px rgba(20,32,50,.08);--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg2:#080C12;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg2:#080C12;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}
body{background:var(--bg);background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed}
header{position:sticky;top:0;z-index:3;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding-bottom:10px}
header h1{display:flex;align-items:center;gap:10px}
header h1 svg,#lock .lk svg{color:var(--acc)}
#lock .lk{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh)}
#lock .lk svg{width:38px;height:38px}
#lock h1{letter-spacing:-.01em}
.btn{border-radius:14px;transition:transform .12s,box-shadow .12s}
.btn:not(.alt):not(.bad){background:var(--acc);background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#000));box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 32%,transparent)}
.btn:active,.chip:active{transform:scale(.97)}
.fld{border-radius:14px}
.fld:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.it,.it.s,.it.od{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px 12px 18px;position:relative;overflow:hidden;animation:up .28s ease both;transition:transform .12s}
.it::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.it.s::before{background:var(--star)}.it.od::before{background:var(--bad)}
.it:active{transform:scale(.988)}
.it h2{font-size:1.08rem;letter-spacing:-.005em}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chip{box-shadow:0 1px 2px rgba(0,0,0,.05);padding:7px 14px}
.fab{border-radius:20px;padding:16px 24px;box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 45%,transparent)}
#ed .row:has(#eSave){position:sticky;bottom:0;z-index:2;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.ov h2{font-size:1.5rem}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}.srow .cnt{margin:0}
.note,.ck{border-radius:14px}.note{box-shadow:var(--sh)}
.ims img{border-radius:14px}
.empty{padding:72px 16px}
#toast{border-radius:14px;box-shadow:var(--sh)}
@media (prefers-reduced-motion:reduce){.it{animation:none}}
/* ---- v5 ---- */
.srow{flex-wrap:wrap}
.ck2{display:flex;gap:10px;align-items:center;font-size:.95rem}.ck2 input{width:20px;height:20px;accent-color:var(--acc)}
#pwd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}#pwd summary{cursor:pointer;font-weight:600}
.pwb{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ims .au{display:flex;align-items:center;gap:6px;width:100%}.ims audio{flex:1;min-width:0;height:40px}.ims .au .btn{position:static}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;display:none;background:radial-gradient(120% 90% at 50% 0%,#12203A 0%,#0A1020 60%,#060A14 100%)}
body.onlock #bg{display:block}
#bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(64px);opacity:.5;animation:fl 20s ease-in-out infinite alternate}
#bg i:nth-child(1){left:-22vmax;top:-22vmax;background:var(--acc)}
#bg i:nth-child(2){right:-28vmax;top:8vh;background:color-mix(in srgb,var(--acc) 35%,#7C3AED);animation-delay:-7s}
#bg i:nth-child(3){left:-12vmax;bottom:-28vmax;background:color-mix(in srgb,var(--acc) 45%,#06B6D4);animation-delay:-13s}
@keyframes fl{from{transform:translate(-6%,-4%) scale(1)}to{transform:translate(8%,6%) scale(1.18)}}
body.onlock{display:flex;align-items:center;justify-content:center;background:#0A1020}
body.onlock #lock{--ink:#EAF2FA;--mut:#A7B6CA;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);--bad:#FF9C94;min-height:0;width:min(92vw,420px);margin:0;padding:28px 24px;border-radius:30px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:0 24px 60px rgba(0,0,0,.45);color:var(--ink)}
body.onlock #lock .lk{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
body.onlock #lock .lk svg{color:#fff}
body.onlock #lock .fld{color:var(--ink);background:rgba(255,255,255,.08)}
body.onlock #lock .fld::placeholder{color:var(--mut)}
@media (prefers-reduced-motion:reduce){#bg i{animation:none}}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<section id="lock">
  <div class="lk"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
  <h1>Maxfiy daftar</h1>
  <p id="lmsg"></p>
  <input id="pin" class="fld" type="password" autocomplete="off" placeholder="PIN yoki parol">
  <input id="pin2" class="fld" type="password" autocomplete="off" placeholder="Qayta kiriting" hidden>
  <p id="lerr" class="err" role="alert"></p>
  <button id="lbtn" class="btn">Kirish</button>
  <button id="lbio" class="btn alt" hidden>Barmoq izi / yuz bilan kirish</button>
</section>

<div id="app" hidden>
  <header>
    <h1><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Maxfiy daftar</h1>
    <div>
      <button class="btn alt sm" id="bLock">Qulflash</button>
      <button class="btn alt sm" id="bSet">Sozlamalar</button>
    </div>
  </header>
  <main>
    <div class="bar">
      <input id="q" class="fld" type="search" placeholder="Qidirish…">
      <button class="chip" id="fStar" aria-pressed="false">★ Muhim</button>
      <button class="chip" id="fTrash" aria-pressed="false">Savat</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="note" id="bk" hidden></div>
    <button class="note" id="dk" hidden></button>
    <div class="srow"><div class="cnt" id="cnt"></div><button class="chip" id="fLock" aria-pressed="false">Qulflangan</button><button class="chip" id="fSort">Saralash</button></div>
    <div id="list"></div>
  </main>
  <button class="btn fab" id="bNew">+ Yangi yozuv</button>
</div>

<div id="ed" class="ov" hidden>
  <div>
    <label class="lb" id="eTpw">Shablon<select id="eTp" class="fld"><option value="">Bo‘sh yozuv</option><option value="pw">Parol</option><option value="shop">Xarid ro‘yxati</option><option value="diary">Kundalik</option><option value="meet">Uchrashuv</option><option value="todo">Vazifalar</option></select></label>
    <input id="eT" class="fld" placeholder="Sarlavha" maxlength="200">
    <textarea id="eB" class="fld" placeholder="Matn (ixtiyoriy)"></textarea>
    <input id="eG" class="fld" placeholder="Papka / kategoriya (masalan: ish, g‘oya)" maxlength="40">
    <label class="ck2"><input type="checkbox" id="eLk"> Qulflangan yozuv (alohida PIN bilan ochiladi)</label>
    <details id="pwd"><summary>Parol maydonlari (sayt, login, parol)</summary><div class="pwb"><input id="eSt" class="fld" placeholder="Sayt yoki ilova" maxlength="120"><div class="row"><input id="eLg" class="fld" placeholder="Login yoki email" maxlength="120" autocomplete="off"><button class="btn alt sm" id="cLg">Nusxalash</button></div><div class="row"><input id="ePw" class="fld" type="password" placeholder="Parol" maxlength="200" autocomplete="off"><button class="btn alt sm" id="sPw">Ko‘rsatish</button><button class="btn alt sm" id="cPw">Nusxalash</button></div></div></details>
    <div class="row"><label class="lb" style="flex:1">Muddat<input id="eD" class="fld" type="date"></label><label class="lb" style="flex:1">Vaqt<input id="eTm" class="fld" type="time"></label></div>
    <label class="lb">Takrorlash<select id="eRp" class="fld"><option value="">Takrorlanmasin</option><option value="day">Har kuni</option><option value="week">Har hafta</option><option value="month">Har oy</option></select></label>
    <button class="btn alt sm" id="eIcs">Telefon kalendariga eslatma qo‘yish</button>
    <div id="cl"></div>
    <div class="row"><input id="cIn" class="fld" placeholder="Ro‘yxat bandi" maxlength="200"><button class="btn alt sm" id="cAdd">Qo‘shish</button></div>
    <div id="ims" class="ims"></div>
    <div class="row"><button class="btn alt sm" id="iAdd">Rasm qo‘shish</button><button class="btn alt sm" id="iAll">Hamma rasmni chiqarish</button><button class="btn alt sm" id="aRec">Ovoz yozish</button></div>
    <input type="file" id="iIn" accept="image/*" multiple hidden>
    <div class="row">
      <button class="btn alt sm" id="eCopy">Matnni nusxalash</button>
      <button class="btn alt sm" id="eGen">Parol yaratish</button>
    </div>
    <div class="row">
      <button class="btn" id="eSave">Saqlash</button>
      <button class="btn alt" id="eCancel">Bekor qilish</button>
    </div>
    <button class="btn alt" id="eRes" hidden>Tiklash</button>
    <button class="btn bad" id="eDel">O‘chirish</button>
  </div>
</div>

<div id="st" class="ov" hidden>
  <div>
    <h2>Sozlamalar</h2>
    <p class="cnt" id="stInfo"></p>
    <button class="btn alt" id="sExp">Zaxira nusxa olish (shifrlangan)</button>
    <button class="btn alt" id="sImp">Zaxira nusxani yuklash</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button class="btn alt" id="sShare">Ilovani do‘stga yuborish</button>
    <button class="btn alt" id="uIq">Rasm sifati</button>
    <button class="btn alt" id="uTh">Mavzu</button>
    <button class="btn alt" id="uAc">Rang</button>
    <button class="btn alt" id="uFs">Shrift</button>
    <button class="btn alt" id="xTxt">Yozuvlarni matn fayl (.txt) qilib chiqarish</button>
    <button class="btn alt" id="xPdf">Yozuvlarni PDF qilib chiqarish</button>
    <button class="btn alt" id="sBio">Barmoq izi / yuz bilan kirishni yoqish</button>
    <button class="btn alt" id="sPin">PIN/parolni almashtirish</button>
    <button class="btn bad" id="sWipe">Barcha ma’lumotni o‘chirish</button>
    <button class="btn" id="sClose">Orqaga</button>
  </div>
</div>

<div id="iv" hidden><img id="ivImg" alt="Rasm"><div id="ivb"><button class="btn" id="ivSave">Telefonga saqlash / yuborish</button><button class="btn alt" id="ivClose">Yopish</button></div></div>

<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var K='md_vault_v1',F='md_fails',U='md_until';
var enc=new TextEncoder(),dec=new TextDecoder();
var key=null,salt=null,items=[],flt={q:'',star:false,tag:'',trash:false},cur=null,hiddenAt=0,busy=false,iters=600000,idleT=0;

function ls(a,k,v){try{if(a==='g')return localStorage.getItem(k);if(a==='s')localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2400)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(ts){var d=new Date(ts);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()}

/* ---- Shifrlash: PBKDF2 (250 000) + AES-256-GCM ---- */
async function derive(pin,s,it){
  var m=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:it||600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify({v:2,items:items,ik:ikRaw})));
  return{v:1,it:iters,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function save(){
  var v=await seal();
  try{localStorage.setItem(K,JSON.stringify(v));return true}catch(e){toast('Saqlab bo‘lmadi: xotira to‘lgan');return false}
}
async function unseal(v,pin){
  var s=unb64(v.salt),it=v.it||250000,k=await derive(pin,s,it);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.ct));
  var d=JSON.parse(dec.decode(pt));return{k:k,s:s,it:it,list:Array.isArray(d)?d:d.items,ik:Array.isArray(d)?null:d.ik};
}

/* ---- Qulf ekrani ---- */
function showLock(){
  key=null;items=[];cur=null;clearTimeout(idleT);if(typeof rec!=='undefined'&&rec){try{rec.stop()}catch(e){}}lkOpen=false;ecl=[];eim=[];imk=null;ikRaw='';imc={};newIm={};$('#ims').innerHTML='';$('#cl').innerHTML='';$('#ivImg').removeAttribute('src');$('#iv').hidden=true;
  ['#app','#ed','#st'].forEach(function(s){$(s).hidden=true});
  $('#lock').hidden=false;document.body.classList.add('onlock');
  var has=!!ls('g',K);
  $('#pin2').hidden=has;
  $('#lmsg').textContent=has?'Kirish uchun PIN yoki parolni kiriting.':'Yangi PIN yoki parol o‘rnating (kamida 4 belgi, 6 va undan ko‘pi yaxshiroq). Uni unutsangiz, ma’lumotni tiklab bo‘lmaydi.';
  $('#lbtn').textContent=has?'Kirish':'O‘rnatish';$('#lbio').hidden=!(has&&ls('g','md_bio'));
  $('#pin').value='';$('#pin2').value='';$('#lerr').textContent='';
}
async function submitLock(){
  if(busy)return;
  if(!window.crypto||!crypto.subtle){$('#lerr').textContent='Bu brauzer shifrlashni qo‘llab-quvvatlamaydi. Chrome’da oching.';return}
  var pin=$('#pin').value,v=ls('g',K),err=$('#lerr');err.textContent='';
  busy=true;$('#lbtn').disabled=true;
  try{
    if(!v){
      if(pin.length<4){err.textContent='Kamida 4 belgi kiriting.';return}
      if(pin!==$('#pin2').value){err.textContent='Ikkala maydon bir xil emas.';return}

function mkPdf(text){
  var W=794,H=1123,M=50,SC=2,pages=[],c,x,y;
  function np(){c=document.createElement('canvas');c.width=W*SC;c.height=H*SC;x=c.getContext('2d');x.scale(SC,SC);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#111';x.font='15px sans-serif';y=M;pages.push(c)}
  function out(t){if(y>H-M)np();x.fillText(t,M,y);y+=22}
  np();
  text.split('\n').forEach(function(line){
    var b=line.indexOf('### ')===0;if(b){line=line.slice(4);y+=6;x.font='bold 18px sans-serif'}
    var cur='';line.split(' ').forEach(function(w){var t=cur?cur+' '+w:w;if(x.measureText(t).width>W-2*M&&cur){out(cur);cur=w}else cur=t});
    out(cur);if(b)x.font='15px sans-serif';
  });
  var jp=pages.map(function(p){var d=atob(p.toDataURL('image/jpeg',.85).split(',')[1]),a=new Uint8Array(d.length);for(var i=0;i<d.length;i++)a[i]=d.charCodeAt(i);return a});
  var parts=[],pos=0,xr=[];
  function w(v){if(typeof v==='string')v=enc.encode(v);parts.push(v);pos+=v.length}
  function ob(n,f){xr[n]=pos;w(n+' 0 obj\n');f();w('\nendobj\n')}
  w('%PDF-1.4\n');
  ob(1,function(){w('<< /Type /Catalog /Pages 2 0 R >>')});
  ob(2,function(){w('<< /Type /Pages /Count '+jp.length+' /Kids ['+jp.map(function(_,i){return(5+3*i)+' 0 R'}).join(' ')+'] >>')});
  jp.forEach(function(j,i){
    ob(3+3*i,function(){w('<< /Type /XObject /Subtype /Image /Width '+W*SC+' /Height '+H*SC+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n');w(j);w('\nendstream')});
    var cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    ob(4+3*i,function(){w('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream')});
    ob(5+3*i,function(){w('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+(3+3*i)+' 0 R >> >> /Contents '+(4+3*i)+' 0 R >>')});
  });
  var n=3+3*jp.length,xs=pos;
  w('xref\n0 '+n+'\n0000000000 65535 f \n');
  for(var k=1;k<n;k++)w(('0000000000'+xr[k]).slice(-10)+' 00000 n \n');
  w('trailer\n<< /Size '+n+' /Root 1 0 R >>\nstartxref\n'+xs+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
async function outFile(name,mime,data,isB64){
  if(!confirm('Yozuvlar shifrlanmagan holda telefoningizga chiqariladi. Davom etilsinmi?'))return;
  try{
    if(NATIVE&&plg('Filesystem')&&plg('Share')){
      var o={path:name,data:data,directory:'CACHE'};if(!isB64)o.encoding='utf8';
      var r=await plg('Filesystem').writeFile(o);
      await plg('Share').share({title:name,files:[r.uri],dialogTitle:'Faylni saqlash yoki yuborish'});
      plg('Filesystem').deleteFile({path:name,directory:'CACHE'}).catch(function(){});
    }else{
      var f=new File([isB64?unb64(data):data],name,{type:mime});
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
      else{var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
    }
  }catch(e){var m=String(e&&(e.message||e.name)).toLowerCase();if(m.indexOf('cancel')<0&&m.indexOf('abort')<0)toast('Faylni chiqarib bo‘lmadi')}
}

async function lkHash(p,sl){var m=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:sl,iterations:200000,hash:'SHA-256'},m,256))}
async function lkAuth(){
  if(lkOpen)return true;

    if(a.length<4){toast('Kamida 4 belgi kerak');return false}

    var sl=rnd(16);items.push({id:uid(),sys:'lk',salt:b64(sl),h:await lkHash(a,sl),upd:0});await save();lkOpen=true;return true;
  }

  if(await lkHash(p,unb64(li.salt))===li.h){lkOpen=true;return true}
  toast('Alohida PIN noto‘g‘ri');return false;
}
