<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E78">
<title>Maxfiy daftar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EDF1F5;--card:#fff;--ink:#17202E;--mut:#5E6B7D;--line:#D5DCE5;--acc:#0B6E78;--on:#fff;--star:#D9961A;--bad:#B3322B;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151D;--card:#1A212C;--ink:#E7ECF3;--mut:#93A0B2;--line:#2A3342;--acc:#3FB8C4;--on:#06262A;--star:#F0B440;--bad:#F07A72;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10151D;--card:#1A212C;--ink:#E7ECF3;--mut:#93A0B2;--line:#2A3342;--acc:#3FB8C4;--on:#06262A;--star:#F0B440;--bad:#F07A72;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none}
.fld:focus-visible,.btn:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#lock{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto;padding:24px}
#lock h1{font-size:2rem}
#lock p{margin:0;color:var(--mut)}
.err{color:var(--bad);min-height:1.4em;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 8px;max-width:720px;margin:0 auto}
header h1{font-size:1.5rem}
header div{display:flex;gap:8px}
.sm{padding:8px 12px;font-size:.9rem}
main{max-width:720px;margin:0 auto;padding:0 16px 110px}
.bar{display:flex;gap:8px;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.bar .fld{min-width:0}
.note{background:var(--card);border:1px solid var(--star);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.9rem}
.row .fld{flex:2;min-width:0}
.lb{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:.85rem}
.ck{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.ck input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.ck span{flex:1;overflow-wrap:anywhere}.ck.d span{text-decoration:line-through;color:var(--mut)}
.ck button{background:none;border:0;color:var(--bad);font-size:1.3rem;padding:0 6px}
.ims{display:flex;gap:10px;flex-wrap:wrap}.ims div{position:relative}
.ims img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ims .btn{position:absolute;top:-8px;right:-8px;padding:2px 9px;background:var(--card)}
#iv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:8;display:flex;align-items:center;justify-content:center}
#iv img{max-width:100%;max-height:100%}
button.note{width:100%;text-align:left;cursor:pointer}#dk{border-color:var(--bad)}
.od{border-left-color:var(--bad)}
.cnt{color:var(--mut);font-size:.85rem;margin:2px 2px 8px}
.it{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px 14px 14px 8px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer}
.it.s{border-left-color:var(--star)}
.it h2{font-size:1.1rem;overflow-wrap:anywhere}
.it p{grid-column:1;margin:0;color:var(--mut);font-size:.92rem;overflow-wrap:anywhere}
.it .meta{grid-column:1/-1;font-size:.8rem;color:var(--mut);margin-top:4px}
.star{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--line);padding:4px}
.s .star{color:var(--star)}
.empty{text-align:center;color:var(--mut);padding:48px 16px}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(0,0,0,.28);padding:14px 22px;border-radius:999px}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
.ov>div{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
textarea.fld{min-height:42vh;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="lock">
  <h1>Maxfiy daftar</h1>
  <p id="lmsg"></p>
  <input id="pin" class="fld" type="password" autocomplete="off" placeholder="PIN yoki parol">
  <input id="pin2" class="fld" type="password" autocomplete="off" placeholder="Qayta kiriting" hidden>
  <p id="lerr" class="err" role="alert"></p>
  <button id="lbtn" class="btn">Kirish</button>
  <button id="lbio" class="btn alt" hidden>Barmoq izi / yuz bilan kirish</button>
</section>

<div id="app" hidden>
  <header>
    <h1>Maxfiy daftar</h1>
    <div>
      <button class="btn alt sm" id="bLock">Qulflash</button>
      <button class="btn alt sm" id="bSet">Sozlamalar</button>
    </div>
  </header>
  <main>
    <div class="bar">
      <input id="q" class="fld" type="search" placeholder="Qidirish…">
      <button class="chip" id="fStar" aria-pressed="false">★ Muhim</button>
      <button class="chip" id="fTrash" aria-pressed="false">Savat</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="note" id="bk" hidden></div>
    <button class="note" id="dk" hidden></button>
    <div class="cnt" id="cnt"></div>
    <div id="list"></div>
  </main>
  <button class="btn fab" id="bNew">+ Yangi yozuv</button>
</div>

<div id="ed" class="ov" hidden>
  <div>
    <input id="eT" class="fld" placeholder="Sarlavha" maxlength="200">
    <textarea id="eB" class="fld" placeholder="Matn (ixtiyoriy)"></textarea>
    <input id="eG" class="fld" placeholder="Kategoriya (masalan: parol, g‘oya)" maxlength="40">
    <div class="row"><label class="lb" style="flex:1">Muddat<input id="eD" class="fld" type="date"></label><label class="lb" style="flex:1">Vaqt<input id="eTm" class="fld" type="time"></label></div>
    <button class="btn alt sm" id="eIcs">Telefon kalendariga eslatma qo‘yish</button>
    <div id="cl"></div>
    <div class="row"><input id="cIn" class="fld" placeholder="Ro‘yxat bandi" maxlength="200"><button class="btn alt sm" id="cAdd">Qo‘shish</button></div>
    <div id="ims" class="ims"></div>
    <div class="row"><button class="btn alt sm" id="iAdd">Rasm qo‘shish (3 tagacha)</button></div>
    <input type="file" id="iIn" accept="image/*" hidden>
    <div class="row">
      <button class="btn alt sm" id="eCopy">Matnni nusxalash</button>
      <button class="btn alt sm" id="eGen">Parol yaratish</button>
    </div>
    <div class="row">
      <button class="btn" id="eSave">Saqlash</button>
      <button class="btn alt" id="eCancel">Bekor qilish</button>
    </div>
    <button class="btn alt" id="eRes" hidden>Tiklash</button>
    <button class="btn bad" id="eDel">O‘chirish</button>
  </div>
</div>

<div id="st" class="ov" hidden>
  <div>
    <h2>Sozlamalar</h2>
    <p class="cnt" id="stInfo"></p>
    <button class="btn alt" id="sExp">Zaxira nusxa olish (shifrlangan)</button>
    <button class="btn alt" id="sImp">Zaxira nusxani yuklash</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button class="btn alt" id="uTh">Mavzu</button>
    <button class="btn alt" id="uAc">Rang</button>
    <button class="btn alt" id="uFs">Shrift</button>
    <button class="btn alt" id="sBio">Barmoq izi / yuz bilan kirishni yoqish</button>
    <button class="btn alt" id="sPin">PIN/parolni almashtirish</button>
    <button class="btn bad" id="sWipe">Barcha ma’lumotni o‘chirish</button>
    <button class="btn" id="sClose">Orqaga</button>
  </div>
</div>

<div id="iv" hidden><img id="ivImg" alt="Rasm"></div>

<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var K='md_vault_v1',F='md_fails',U='md_until';
var enc=new TextEncoder(),dec=new TextDecoder();
var key=null,salt=null,items=[],flt={q:'',star:false,tag:'',trash:false},cur=null,hiddenAt=0,busy=false,iters=600000,idleT=0;

function ls(a,k,v){try{if(a==='g')return localStorage.getItem(k);if(a==='s')localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2400)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(ts){var d=new Date(ts);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()}

/* ---- Shifrlash: PBKDF2 (250 000) + AES-256-GCM ---- */
async function derive(pin,s,it){
  var m=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:it||600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify({v:2,items:items,ik:ikRaw})));
  return{v:1,it:iters,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function save(){
  var v=await seal();
  try{localStorage.setItem(K,JSON.stringify(v));return true}catch(e){toast('Saqlab bo‘lmadi: xotira to‘lgan');return false}
}
async function unseal(v,pin){
  var s=unb64(v.salt),it=v.it||250000,k=await derive(pin,s,it);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.ct));
  var d=JSON.parse(dec.decode(pt));return{k:k,s:s,it:it,list:Array.isArray(d)?d:d.items,ik:Array.isArray(d)?null:d.ik};
}

/* ---- Qulf ekrani ---- */
function showLock(){
  key=null;items=[];cur=null;clearTimeout(idleT);ecl=[];eim=[];imk=null;ikRaw='';imc={};newIm={};$('#ims').innerHTML='';$('#cl').innerHTML='';$('#ivImg').removeAttribute('src');$('#iv').hidden=true;
  ['#app','#ed','#st'].forEach(function(s){$(s).hidden=true});
  $('#lock').hidden=false;
  var has=!!ls('g',K);
  $('#pin2').hidden=has;
  $('#lmsg').textContent=has?'Kirish uchun PIN yoki parolni kiriting.':'Yangi PIN yoki parol o‘rnating (kamida 4 belgi, 6 va undan ko‘pi yaxshiroq). Uni unutsangiz, ma’lumotni tiklab bo‘lmaydi.';
  $('#lbtn').textContent=has?'Kirish':'O‘rnatish';$('#lbio').hidden=!(has&&ls('g','md_bio'));
  $('#pin').value='';$('#pin2').value='';$('#lerr').textContent='';
}
async function submitLock(){
  if(busy)return;
  if(!window.crypto||!crypto.subtle){$('#lerr').textContent='Bu brauzer shifrlashni qo‘llab-quvvatlamaydi. Chrome’da oching.';return}
  var pin=$('#pin').value,v=ls('g',K),err=$('#lerr');err.textContent='';
  busy=true;$('#lbtn').disabled=true;
  try{
    if(!v){
      if(pin.length<4){err.textContent='Kamida 4 belgi kiriting.';return}
      if(pin!==$('#pin2').value){err.textContent='Ikkala maydon bir xil emas.';return}
      salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pin,salt,iters);items=[];await setIk(b64(rnd(32)));
      if(await save())enter();
    }else{
      var wait=(+ls('g',U)||0)-Date.now();
      if(wait>0){err.textContent='Biroz kuting: '+Math.ceil(wait/1000)+' soniya.';return}
      try{
        var r=await unseal(JSON.parse(v),pin);
        key=r.k;salt=r.s;items=r.list;iters=r.it;await setIk(r.ik||b64(rnd(32)));if(!r.ik)await save();ls('r',F);ls('r',U);if(iters<600000){iters=600000;salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pin,salt,iters);await save()}enter();
      }catch(e){
        var n=(+ls('g',F)||0)+1;ls('s',F,n);
        if(n>=5)ls('s',U,Date.now()+Math.min(600,30*(n-4))*1000);
        err.textContent='PIN yoki parol noto‘g‘ri.'+(n>=5?' Biroz kuting.':'');
      }
    }
  }finally{busy=false;$('#lbtn').disabled=false;$('#pin').value='';$('#pin2').value=''}
}
function enter(){
  $('#lock').hidden=true;$('#app').hidden=false;
  flt={q:'',star:false,tag:'',trash:false};$('#q').value='';
  items=items.filter(function(i){var old=i.del&&Date.now()-i.del>=2592e6;if(old)(i.im||[]).forEach(function(id){idbDel(id)});return !old});
  render();bump();migrateImgs();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
}

/* ---- Ro‘yxat ---- */
function render(){
  var q=flt.q.toLowerCase();
  var tags=[];items.forEach(function(i){if(i.tag&&tags.indexOf(i.tag)<0)tags.push(i.tag)});tags.sort();
  if(flt.tag&&tags.indexOf(flt.tag)<0)flt.tag='';
  $('#fStar').setAttribute('aria-pressed',flt.star);$('#fTrash').setAttribute('aria-pressed',flt.trash);
  var bk=$('#bk');bk.hidden=!(items.length&&!flt.trash&&Date.now()-(+ls('g','md_bk')||0)>12096e5);
  bk.textContent='Zaxira nusxa uzoq vaqtdan beri olinmagan. Sozlamalar → Zaxira nusxa olish.';
  var dn=items.filter(function(i){return !i.del&&i.due&&i.due<=today()}).length,dk=$('#dk');
  if(!dn)flt.due=false;dk.hidden=!dn||flt.trash;dk.textContent=flt.due?'Hammasini ko‘rsatish':'Muddati kelgan yozuvlar: '+dn+' ta (ko‘rish)';
  $('#chips').innerHTML=tags.map(function(t){return'<button class="chip" data-tag="'+esc(t)+'" aria-pressed="'+(flt.tag===t)+'">'+esc(t)+'</button>'}).join('');
  var list=items.filter(function(i){
    return(!!i.del===flt.trash)&&(!flt.due||(i.due&&i.due<=today()))&&(!flt.star||i.star)&&(!flt.tag||i.tag===flt.tag)&&(!q||(i.title+' '+i.body+' '+i.tag).toLowerCase().indexOf(q)>=0);
  }).sort(function(a,b){return(b.star|0)-(a.star|0)||b.upd-a.upd});
  $('#cnt').textContent=items.length?list.length+' ta yozuv':'';
  $('#list').innerHTML=list.length?list.map(function(i){
    var sn=i.body.replace(/\s+/g,' ').slice(0,120),ex=[];
    if(i.cl&&i.cl.length)ex.push(i.cl.filter(function(c){return c.d}).length+'/'+i.cl.length+' bajarildi');
    if(i.im&&i.im.length)ex.push('Rasm: '+i.im.length);
    if(i.due)ex.push('Muddat: '+i.due.split('-').reverse().join('.')+(i.tm?' '+i.tm:''));
    return'<article class="it'+(i.star?' s':'')+(i.due&&i.due<=today()&&!i.del?' od':'')+'" data-id="'+i.id+'"><h2>'+esc(i.title||'Nomsiz')+'</h2><button class="star" data-star="'+i.id+'" aria-label="Muhim deb belgilash">'+(i.star?'★':'☆')+'</button>'+(sn?'<p>'+esc(sn)+'</p>':'')+'<div class="meta">'+(i.tag?esc(i.tag)+' | ':'')+fmt(i.upd)+(ex.length?' | '+ex.join(' | '):'')+'</div></article>';
  }).join(''):'<div class="empty">'+(items.length?'Hech narsa topilmadi.':'Hozircha yozuv yo‘q. “Yangi yozuv” tugmasini bosing.')+'</div>';
}

/* ---- Tahrirlash ---- */
function openEd(id){
  cur=id?items.filter(function(i){return i.id===id})[0]:null;
  $('#eT').value=cur?cur.title:'';$('#eB').value=cur?cur.body:'';$('#eG').value=cur?cur.tag:'';
  ecl=cur&&cur.cl?cur.cl.map(function(c){return{t:c.t,d:c.d}}):[];eim=cur&&cur.im?cur.im.slice():[];newIm={};$('#eD').value=cur&&cur.due||'';$('#eTm').value=cur&&cur.tm||'';$('#cIn').value='';drawCl();loadIm();
  $('#eDel').hidden=!cur;$('#eDel').textContent=cur&&cur.del?'Butunlay o‘chirish':'Savatga tashlash';$('#eRes').hidden=!(cur&&cur.del);$('#ed').hidden=false;$('#eT').focus();
}
async function saveEd(){
  var t=$('#eT').value.trim(),b=$('#eB').value,g=$('#eG').value.trim(),d=$('#eD').value,x=$('#cIn').value.trim();
  if(x)ecl.push({t:x.slice(0,200),d:false});
  if(!t&&!b.trim()&&!ecl.length&&!eim.length){toast('Sarlavha, matn yoki rasm kiriting');return}
  try{for(var q=0;q<eim.length;q++){var id=eim[q];if(newIm[id]&&imc[id]){await idbPut(id,await imgSeal(imc[id]));delete newIm[id]}}}
  catch(e){toast('Rasmni saqlab bo‘lmadi (xotira to‘lgan bo‘lishi mumkin)');return}
  var prev=cur&&cur.im?cur.im.slice():[];
  if(!cur){cur={id:uid(),star:false};items.push(cur)}
  cur.title=t;cur.body=b;cur.tag=g;cur.due=d;cur.tm=$('#eTm').value;cur.cl=ecl;cur.im=eim;cur.upd=Date.now();
  if(!(await save()))return;
  prev.forEach(function(id){if(eim.indexOf(id)<0)idbDel(id)});
  imc={};$('#ed').hidden=true;render();toast('Saqlandi');
}
async function delEd(){
  if(!cur)return;
  if(!cur.del){cur.del=Date.now();toast('Savatga o‘tkazildi (30 kun saqlanadi)')}
  else{if(!confirm('Bu yozuv butunlay o‘chiriladi. Davom etilsinmi?'))return;var c=cur;items=items.filter(function(i){return i!==c});(c.im||[]).forEach(function(id){idbDel(id)});toast('O‘chirildi')}
  await save();$('#ed').hidden=true;render();
}
function bump(){clearTimeout(idleT);if(key)idleT=setTimeout(showLock,120000)}

/* ---- Sozlamalar ---- */
async function exportBk(){
  var v=await seal();v.imgs={};
  for(var q=0;q<items.length;q++){var L=items[q].im||[];for(var w=0;w<L.length;w++){var rr=await idbGet(L[w]);if(rr)v.imgs[L[w]]={iv:b64(rr.iv),ct:b64(rr.ct)}}}
  var blob=new Blob([JSON.stringify(v)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='maxfiy-daftar-zaxira-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  ls('s','md_bk',Date.now());render();toast('Zaxira nusxa saqlandi');
}
async function importBk(file){
  try{
    var v=JSON.parse(await file.text());
    var pin=prompt('Zaxira nusxa o‘sha paytdagi PIN yoki parolni kiriting:');
    if(pin===null)return;
    var r=await unseal(v,pin),have={},n=0;
    items.forEach(function(i){have[i.id]=1});
    var bk=r.ik?await crypto.subtle.importKey('raw',unb64(r.ik),'AES-GCM',false,['decrypt']):null;
    for(var q=0;q<r.list.length;q++){var it=r.list[q];if(have[it.id])continue;items.push(it);n++;
      var ids=it.im||[];for(var w=0;w<ids.length;w++){var m=v.imgs&&v.imgs[ids[w]];if(m&&bk){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv)},bk,unb64(m.ct));await idbPut(ids[w],await imgSeal(dec.decode(pt)))}}}
    await migrateImgs();
    await save();render();toast(n+' ta yozuv qo‘shildi');
  }catch(e){toast('Zaxira nusxani ochib bo‘lmadi (PIN noto‘g‘ri yoki fayl buzilgan)')}
}
async function changePin(){
  var p=prompt('Yangi PIN yoki parol (kamida 4 belgi):');
  if(p===null)return;

  if(p!==prompt('Yangi PIN yoki parolni qayta kiriting:')){toast('Ikkalasi bir xil emas');return}
  salt=crypto.getRandomValues(new Uint8Array(16));iters=600000;key=await derive(p,salt,iters);
  await save();ls('r',BIO);toast('PIN almashtirildi. Biometrik kirishni qayta yoqing.');
}
function wipe(){

/* ---- Rasm xotirasi (IndexedDB, shifrlangan) ---- */
var ikRaw='',imk=null,imc={},newIm={};
function idb(){return new Promise(function(ok,no){var r=indexedDB.open('md_img',1);r.onupgradeneeded=function(){r.result.createObjectStore('i')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})}
function idbReq(mode,fn){return idb().then(function(d){return new Promise(function(ok,no){var t=d.transaction('i',mode),rq=fn(t.objectStore('i'));t.oncomplete=function(){ok(rq&&rq.result)};t.onerror=t.onabort=function(){no(t.error)}})})}
function idbPut(id,v){return idbReq('readwrite',function(o){return o.put(v,id)})}
function idbGet(id){return idbReq('readonly',function(o){return o.get(id)})}
function idbDel(id){return idbReq('readwrite',function(o){return o.delete(id)}).catch(function(){})}
async function setIk(raw){ikRaw=raw;imk=await crypto.subtle.importKey('raw',unb64(raw),'AES-GCM',false,['encrypt','decrypt'])}
async function imgSeal(u){var iv=rnd(12);return{iv:iv,ct:await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},imk,enc.encode(u))}}
async function imgOpen(id){var v=await idbGet(id);if(!v)return null;try{return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:v.iv},imk,v.ct))}catch(e){return null}}
async function loadIm(){for(var q=0;q<eim.length;q++){var id=eim[q];if(!imc[id]){var u=await imgOpen(id);if(u)imc[id]=u}}drawIm()}
async function migrateImgs(){
  var ch=false;
  try{
    for(var q=0;q<items.length;q++){var L=items[q].im;if(!L)continue;
      for(var w=0;w<L.length;w++){if(String(L[w]).indexOf('data:')===0){var id=uid();await idbPut(id,await imgSeal(L[w]));L[w]=id;ch=true}}}
    if(ch){await save();render()}
  }catch(e){toast('Rasmlarni ko‘chirib bo‘lmadi')}
}
async function stInfo(){
  var t='';
  try{var e=await navigator.storage.estimate(),p=navigator.storage.persisted?await navigator.storage.persisted():false;
    t='Xotira: '+(e.usage/1048576).toFixed(1)+' MB / '+(e.quota/1048576).toFixed(0)+' MB. Doimiy himoya: '+(p?'ha':'yo‘q')+'.';
    if(e.quota&&e.usage/e.quota>.8)t+=' Xotira to‘lib bormoqda!'}catch(x){}
  $('#stInfo').textContent=t;
}
function p2(n){return('0'+n).slice(-2)}
function icsLocal(dt){return dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+'T'+p2(dt.getHours())+p2(dt.getMinutes())+'00'}
function makeIcs(){
  var d=$('#eD').value,t=$('#eTm').value||'09:00';
  if(!d){toast('Avval muddat sanasini tanlang');return}
  var ti=($('#eT').value.trim()||'Eslatma').replace(/[\\;,\r\n]/g,' ');
  if(!confirm('Telefon kalendariga faqat sarlavha ("'+ti+'") va vaqt yoziladi, matn yozilmaydi. Davom etilsinmi?'))return;
  var a=new Date(d+'T'+t+':00'),e=new Date(a.getTime()+18e5);
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Maxfiy daftar//UZ','BEGIN:VEVENT','UID:'+uid()+'@daftar','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+icsLocal(a),'DTEND:'+icsLocal(e),'SUMMARY:'+ti,'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:'+ti,'END:VALARM','END:VEVENT','END:VCALENDAR'];
  var bl=new Blob([L.join('\r\n')],{type:'text/calendar'}),k=document.createElement('a');
  k.href=URL.createObjectURL(bl);k.download='eslatma.ics';document.body.appendChild(k);k.click();k.remove();
  setTimeout(function(){URL.revokeObjectURL(k.href)},4000);
  toast('Yuklangan eslatma faylini oching va Kalendar’da saqlang');
}

/* ---- Ro‘yxat, rasm, muddat ---- */
var ecl=[],eim=[];
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function drawCl(){$('#cl').innerHTML=ecl.map(function(c,i){return'<div class="ck'+(c.d?' d':'')+'"><input type="checkbox" data-ci="'+i+'"'+(c.d?' checked':'')+' aria-label="Bajarildi"><span>'+esc(c.t)+'</span><button data-cx="'+i+'" aria-label="O‘chirish">×</button></div>'}).join('')}
function drawIm(){$('#ims').innerHTML=eim.map(function(id,i){var u=imc[id];if(!u||!/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(u))return'';return'<div><img src="'+u+'" data-iv="'+i+'" alt="Rasm"><button class="btn bad sm" data-ix="'+i+'" aria-label="Rasmni o‘chirish">×</button></div>'}).join('')}
function shrink(f){return new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.6))};im.onerror=no;im.src=u})}
function addCl(){var v=$('#cIn').value.trim();if(!v)return;ecl.push({t:v.slice(0,200),d:false});$('#cIn').value='';drawCl()}

/* ---- Mavzu, rang, shrift ---- */
var ACC={teal:['Zangori','#0B6E78','#3FB8C4'],blue:['Ko‘k','#2457C5','#7AA2FF'],green:['Yashil','#2E7D32','#7BD17F'],purple:['Binafsha','#6A3FB5','#B79CFF']};
var TH={auto:'Avto',light:'Yorug‘',dark:'Qorong‘i'},FS={s:['Kichik','14px'],m:['O‘rta','16px'],l:['Katta','19px']};
function uiGet(){try{return JSON.parse(ls('g','md_ui'))||{}}catch(e){return{}}}
function uiApply(){
  var u=uiGet(),th=TH[u.th]?u.th:'auto',r=document.documentElement;
  r.setAttribute('data-theme',th==='auto'?'':th);
  var dark=th==='dark'||(th==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),a=ACC[u.ac]||ACC.teal,f=FS[u.fs]||FS.m;
  r.style.setProperty('--acc',dark?a[2]:a[1]);r.style.fontSize=f[1];
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=a[1];
  $('#uTh').textContent='Mavzu: '+TH[th];$('#uAc').textContent='Rang: '+a[0];$('#uFs').textContent='Shrift: '+f[0];
}
function uiNext(k,list,def){var u=uiGet(),ks=Object.keys(list),i=ks.indexOf(u[k]||def);u[k]=ks[(i+1)%ks.length];ls('s','md_ui',JSON.stringify(u));uiApply()}

/* ---- Barmoq izi / yuz bilan kirish (WebAuthn PRF) ---- */
var BIO='md_bio';
function rnd(n){return crypto.getRandomValues(new Uint8Array(n))}
function bioKey(o){return crypto.subtle.importKey('raw',o,'AES-GCM',false,['encrypt','decrypt'])}
async function bioOn(){
  try{
    if(!window.PublicKeyCredential){toast('Bu brauzer qo‘llab-quvvatlamaydi');return}
    var pin=prompt('Tasdiqlash uchun joriy PIN yoki parolni kiriting:');if(pin===null)return;
    try{await unseal(JSON.parse(ls('g',K)),pin)}catch(e){toast('PIN yoki parol noto‘g‘ri');return}
    var cred=await navigator.credentials.create({publicKey:{rp:{name:'Maxfiy daftar'},user:{id:rnd(16),name:'daftar',displayName:'Maxfiy daftar'},challenge:rnd(32),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},extensions:{prf:{}}}});
    var x=cred.getClientExtensionResults();
    if(!x.prf||!x.prf.enabled){toast('Bu telefon xavfsiz biometrik qulfni qo‘llab-quvvatlamaydi');return}
    var ps=rnd(32);
    var a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:cred.rawId}],userVerification:'required',extensions:{prf:{eval:{first:ps}}}}});
    var r=a.getClientExtensionResults().prf;
    if(!r||!r.results||!r.results.first){toast('Bu telefon xavfsiz biometrik qulfni qo‘llab-quvvatlamaydi');return}
    var iv=rnd(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},await bioKey(r.results.first),enc.encode(pin));
    ls('s',BIO,JSON.stringify({id:b64(cred.rawId),ps:b64(ps),iv:b64(iv),ct:b64(ct)}));
    toast('Biometrik kirish yoqildi');
  }catch(e){toast('Yoqib bo‘lmadi yoki bekor qilindi')}
}
async function bioGo(){
  var b=JSON.parse(ls('g',BIO)||'null');if(!b||busy)return;
  try{
    var a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(b.id)}],userVerification:'required',extensions:{prf:{eval:{first:unb64(b.ps)}}}}});
    var f=a.getClientExtensionResults().prf.results.first;
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(b.iv)},await bioKey(f),unb64(b.ct));
    $('#pin').value=dec.decode(pt);await submitLock();
  }catch(e){$('#lerr').textContent='Biometrik tasdiq bajarilmadi. PIN kiriting.'}
}
